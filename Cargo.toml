[workspace]
resolver = "2"
members = [
    "crates/pkg-manifest",
    "crates/pkg-extract",
    "crates/pkg-repo",
    "crates/pkg-check",
    # Kept building and tested, but not on the product path: see /docs/proof-of-concept on the dashboard.
    "poc/crates/pkg-store",
    "poc/crates/pkg-hooks",
    "crates/omarchy-cli",
]

[workspace.package]
# Versions come from git tags (see .github/workflows/release.yml); this stays 0.0.0.
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/firemanxbr/omarchy-pool"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
pkg-manifest = { path = "crates/pkg-manifest" }
pkg-extract = { path = "crates/pkg-extract" }
pkg-repo = { path = "crates/pkg-repo" }
pkg-check = { path = "crates/pkg-check" }
pkg-store = { path = "poc/crates/pkg-store" }
pkg-hooks = { path = "poc/crates/pkg-hooks" }

# Shared external deps (pinned in one place)
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
similar_names = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
