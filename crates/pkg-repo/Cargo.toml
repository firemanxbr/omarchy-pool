[package]
name = "pkg-repo"
description = "Renders repo-add compatible pacman databases from the package index and publishes releases"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "pkg-repo"
path = "src/main.rs"

[dependencies]
pkg-manifest = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tar = "0.4"
flate2 = "1"
base64 = "0.22"
zstd = "0.13"
pkg-extract = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sha2 = { workspace = true }
hex = { workspace = true }
signal-hook = "0.3"
# A stopped task's process groups are signalled without unsafe code (#277): kill(2) on a group, and whether it is still there.
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
