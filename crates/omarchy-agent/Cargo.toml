[package]
name = "omarchy-agent"
description = "The host agent: verify a signed host bundle or rollback statement, lint the host set, and roll it out"
# The agent's own semver (design v2 D17), bumped only when its code changes; never the
# release tag, so an unchanged agent keeps its hash from release to release.
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
# sigstore-verify needs 1.86; the pinned toolchain (rust-toolchain.toml) is newer.
rust-version = "1.86"

[[bin]]
name = "omarchy-agent"
path = "src/main.rs"

[features]
# Exposes the parsers to the fuzz targets (fuzz/), and nothing else: no verified type can
# be built through it.
fuzzing = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
toml = "0.9"
tar = "0.4"
flate2 = "1"
yaml-rust2 = { version = "0.13", default-features = false }
# verify/ only. Pinned exactly and with no default features (design v2 D2): Sigstore's
# verification crate, offline, with no HTTP client and no async runtime. The whole tree
# is under cargo deny (deny.toml).
sigstore-verify = { version = "=0.14.0", default-features = false }
x509-cert = "0.2"
# The host's identity and its calls to the pool (#321), and the run loop's HTTPS to the
# pool and GitHub (#315): the host key is Ed25519 through aws-lc-rs (already the
# verifier's crypto, through rustls-webpki), or ECDSA P-256 made in the machine's TPM
# through tpm2-tools, which aws-lc-rs checks (#330); HTTPS is ureq on rustls with that same
# provider and the webpki roots — blocking, no async runtime, no OpenSSL, no ring
# (tests/agent-deps.sh).
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.22"
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
# run/ only: SIGUSR1 (`omarchy-agent round`) as a flag the loop reads, without unsafe code here.
signal-hook = { version = "0.3", default-features = false }
# capacity/: statvfs on the work root and the engine's data root, and the page size;
# install/ (#317): owner files written through openat with O_NOFOLLOW in a directory the
# agent owns (its effective uid), and secrets typed on /dev/tty without echo; enroll/: the
# host name from uname on a Mac, which has no /proc (#320). No unsafe code here.
rustix = { version = "1", default-features = false, features = ["std", "fs", "param", "process", "system", "termios"] }

[dev-dependencies]
rcgen = "0.14"

[lints]
workspace = true
