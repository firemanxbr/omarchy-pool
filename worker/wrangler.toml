name = "omarchy-repo"
main = "src/index.ts"
compatibility_date = "2026-09-01"
account_id = "34f1918ac9ca522150a1830ea9b61a40"

# Custom domains in two zones, omarchy-pool.org and firemanxbr.org; both must
# exist in this account. omarchy-pool.org is the dashboard; pkgs.omarchy-pool.org
# the API for machines. www and the three firemanxbr.org names are the rest
# (src/meta.ts): the dashboard's old names and www redirect a page to
# omarchy-pool.org and answer /api/v1/* in place; pkgs.firemanxbr.org keeps
# serving everything — a machine's curl does not follow a redirect. The deploy
# token needs Zone: Read and Workers Routes: Edit on BOTH zones: an
# account-owned token (Cloudflare dashboard → Manage account → Account API
# tokens → "omarchy-pool github-actions deploy" → Edit; not My Profile).
routes = [
  { pattern = "omarchy-pool.org", custom_domain = true },
  { pattern = "www.omarchy-pool.org", custom_domain = true },
  { pattern = "pkgs.omarchy-pool.org", custom_domain = true },
  { pattern = "pkgs.firemanxbr.org", custom_domain = true },
  { pattern = "omarchy-pool.firemanxbr.org", custom_domain = true },
  { pattern = "dashboard-omarchy.firemanxbr.org", custom_domain = true }
]

# The setup script (src/setup.sh) is served as text: `curl …/setup | sudo bash`;
# the documentation's chapters (src/docs/*.md) are bundled the same way and
# rendered by the dashboard (their diagrams are drawn there, pages/doc-diagrams.ts).
[[rules]]
type = "Text"
globs = ["**/*.sh", "**/*.md", "**/*.yml"]
fallthrough = true

[observability]
enabled = true

# Signing hashes whole package objects inside the Worker (src/signing.ts);
# the largest ones (browsers) need more CPU than the default budget.
[limits]
cpu_ms = 120000

# The pool's own scheduler (src/scheduler.ts): every ten minutes, queue the
# pool's jobs that are due and run the brain's own (metrics, cost, audience).
[triggers]
crons = ["*/10 * * * *"]

# Metadata: package graph. Create with `wrangler d1 create omarchy-repo`
# and paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "omarchy-repo"
database_id = "e2f04e65-465c-4170-8750-69061f846b9b"
migrations_dir = "migrations"

# Pool objects: pool/<sha256>.pkg.tar.zst (+ .sig); generated databases: releases/<id>/...
# Create with `wrangler r2 bucket create omarchy-packages`.
[[r2_buckets]]
binding = "PACKAGES"
bucket_name = "omarchy-packages"

# Factory staging: what contributors' workers build, in their own workspace
# (staging/<login>/<package>/<task>/…), waiting for a maintainer. Never
# served to users; objects expire after 30 days (lifecycle rule, RUNBOOK).
# Create with `wrangler r2 bucket create omarchy-factory-staging`.
[[r2_buckets]]
binding = "STAGING"
bucket_name = "omarchy-factory-staging"

[vars]
DEFAULT_RING = "stable"
# Task kinds the scheduler creates as pulled jobs (pkg-repo work) instead of
# GitHub workflows: sync, promote, render, health, security, metrics, gc.
JOB_KINDS = "gc,health,sync,promote,security,metrics,enqueue,verify"
# The daily cost estimate (src/cost.ts) reads this account's analytics with
# the CLOUDFLARE_ANALYTICS_TOKEN secret. The daily audience count
# (src/audience.ts) reads the same account's request analytics with the same
# token — one account-scoped query over both names of the pool.
CLOUDFLARE_ACCOUNT_ID = "34f1918ac9ca522150a1830ea9b61a40"
CLOUDFLARE_D1_ID = "e2f04e65-465c-4170-8750-69061f846b9b"
# "Sign in with GitHub": the OAuth App "omarchy-pool" (registered under the
# account that runs the staging deployment; the secret is a Worker secret,
# GITHUB_OAUTH_CLIENT_SECRET). Empty = the token form only.
GITHUB_OAUTH_CLIENT_ID = "Ov23li8tzO3kMFQUFqnQ"
# Static origin for packages and databases (the R2 bucket's custom domain;
# pool.firemanxbr.org is its second name and still serves, src/meta.ts).
POOL_URL = "https://pool.omarchy-pool.org"
# Page views on the dashboard, if wanted: a Google Analytics 4 measurement id
# ("G-XXXXXXXXXX" — sets cookies) or a Cloudflare Web Analytics site token
# (32 hex characters — sets none; Analytics → Web Analytics in the Cloudflare
# dashboard, add omarchy-pool.org). Empty: no script on any page.
ANALYTICS = ""
# Overridden by the Release workflow (`wrangler deploy --var POOL_VERSION:v0.0.1 ...`).
POOL_VERSION = "dev"
POOL_COMMIT = ""
POOL_DEPLOYED_AT = ""

# Secrets (set with `wrangler secret put <NAME>`):
#   JOB_TOKEN_SECRET — signs the per-job tokens workers get at claim time (jobtoken.ts)
#   SIGNING_KEY      — the pool's OpenPGP private key, armored (signing.ts)
#   GITHUB_TOKEN     — fine-grained token, read-only: a higher rate limit for the reads the pool makes (never a write scope)
#   GITHUB_REPORT_TOKEN — a separate fine-grained token, Issues: Read and write only — the daily cost comment (cost.ts postCostReport)
#   GITHUB_OAUTH_CLIENT_SECRET — the OAuth App behind "Sign in with GitHub"
#   CLOUDFLARE_ANALYTICS_TOKEN — API token with Account · Analytics · Read, for the daily cost estimate and the audience count
