# A worker: `docker compose up -d` (or podman compose). Every restart is a
# new container from the signed image. A contributor's worker builds one
# task per container; a maintainer's (a registration the project trusted)
# also needs the runtime's socket — see the commented lines and /docs/workers.
services:
  worker:
    image: ghcr.io/firemanxbr/omarchy-worker:latest
    restart: unless-stopped
    # A stop is a drain: the worker finishes the task it holds, claims no
    # new one and exits. Without the grace period `compose down` kills the
    # build after ten seconds and the pool waits half an hour for the lease
    # to expire before anyone else may take it.
    stop_grace_period: 3h
    environment:
      OMARCHY_WORKER_TOKEN: ${OMARCHY_WORKER_TOKEN:?the worker token from the Contributors page, shown once}
      WORKER_LABELS: '{"where":"${WHERE:-my-machine}"}'
      # 1 = also build other contributors' packages (donated compute); default: yours only.
      WORKER_SHARED: ${WORKER_SHARED:-0}
      # Optional role — pool, review or community (docs: /docs/workers#roles):
      # narrows the container to one kind of work; the project's own hosts
      # run two of each (factory/host/compose.yml).
      OMARCHY_WORKER_ROLE: ${OMARCHY_WORKER_ROLE:-}
      # Optional: your own agent — one key is enough (your key, your cost). A
      # contributor's worker drafts and corrects PKGBUILDs with it; a project
      # worker audits staged builds. FACTORY_MODEL picks the model.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      # Or a Claude subscription instead of a key: the token `claude setup-token`
      # prints on your machine. The worker installs Claude Code at start and
      # runs it in print mode (docs: /docs/workers#claude-code). Your
      # subscription, your terms, your rate limits.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      FACTORY_PROVIDER: ${FACTORY_PROVIDER:-}
      FACTORY_MODEL: ${FACTORY_MODEL:-}
      # GitHub's API: the release, the files of every package it builds. Without
      # a token: 60 requests an hour from your address. A fine-grained token
      # with no permissions at all, made for this worker — never `gh auth
      # token`, which is your account. What the worker holds — this, the
      # agent's key, its own token — the build never sees (/docs/workers#secrets).
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Project workers only: a directory with the SAME path on the host and in the container.
      # OMARCHY_WORK_DIR: ${HOME}/omarchy-worker
    # Project workers only: the runtime's socket, and that directory.
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock
    #   - ${HOME}/omarchy-worker:${HOME}/omarchy-worker
