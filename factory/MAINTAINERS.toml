# Who maintains the Omarchy pool's factory.
#
# This file is the governance record. Every login listed here is a
# maintainer: they have the project build what contributors stage, approve
# the project's builds into the rings, trust workers, block what must not
# come in and settle each package's category. Everyone else who signs in
# is a contributor. There is
# no other role, no areas, and no other way to become a maintainer.
#
# Changing this file — a new maintainer, a departure — is a decision people
# make, in a pull request that at least one *other* maintainer approves
# (CODEOWNERS + the rule on main: one approval, never the author's own;
# never auto-merged). The pool reads main every ten minutes and applies it.
#
# Nobody is above this file. The repository's admin can merge a pull
# request alone — GitHub records the bypass on it for everyone to see —
# and the project's rule is that it never happens here. The project
# belongs to its maintainers and contributors. This is a community pool —
# nothing in it is official Omarchy.
#
# Bootstrap: while there was a single maintainer, that maintainer merged
# the first promotion alone; GitHub recorded the bypassed review
# (2026-09-17).

# maralcbr: the pool's first contributor (2026-09-15), twenty-odd packages
# requested and built on workers of his own, two of them shared with
# everyone; a second maintainer is what makes the two-person rule real —
# nobody decides on their own package, so each maintainer decides on the
# other's. Added 2026-09-17.
maintainers = ["firemanxbr", "maralcbr"]
