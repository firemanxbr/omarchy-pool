# Who maintains the Omarchy pool's factory.
#
# This file is the governance record. Every login listed here is a
# maintainer: they have the project build what contributors stage, approve
# the project's builds into the rings, trust workers, block what must not
# come in and settle each package's category. Everyone else who signs in
# is a contributor. There is
# no other role, no areas, and no other way to become a maintainer.
#
# Changing this file — a new maintainer, a departure — is a decision people
# make, in a pull request that at least one *other* maintainer approves
# (CODEOWNERS + the rule on main: one approval, never the author's own;
# never auto-merged). The pool reads main every ten minutes and applies it.
#
# Nobody is above this file. The repository's admin can merge a pull
# request alone — GitHub records the bypass on it for everyone to see —
# and the project's rule is that it never happens here. The project
# belongs to its maintainers and contributors. This is a community pool —
# nothing in it is official Omarchy.
#
# Bootstrap: while there was a single maintainer, that maintainer merged
# the first promotion alone; GitHub recorded the bypassed review
# (2026-09-17).

# maralcbr: the pool's first contributor (2026-09-15), twenty-odd packages
# requested and built on workers of his own, two of them shared with
# everyone; a second maintainer is what makes the two-person rule real —
# nobody decides on their own package, so each maintainer decides on the
# other's. Added 2026-09-17.
maintainers = ["firemanxbr", "maralcbr"]

# The solo-maintainer exception (#394, a maintainer decision of 2026-10-06).
# While this table is here, the one maintainer it names builds, reviews and
# approves their own packages: the review's doors (claim, approve with their
# passkey, request changes, reject, release, cancel), the adoption of their
# own package and the requester-host rule (D35: their own host builds the
# project's copy, with no release) let them through, where the two-person
# rule would answer conflict_of_interest. Nothing is hidden: every decision
# taken this way carries `solo_exception` in its signed record, says
# "self-reviewed (solo-maintainer exception)" in the journal, and is marked
# on Review, the build and package pages and Status, which lists them
# (/docs/governance#solo). Every other maintainer keeps the rules as they
# are, and nobody decides on anyone else's package differently. It ends by
# deleting this table in a pull request like any other change here: the next
# sync brings the two-person rule back for everyone, unchanged.
# factory/bin/check-governance refuses a table that is not exactly this: one
# maintainer of the list, a date written "YYYY-MM-DD", a reason on one line.
[solo]
maintainer = "firemanxbr"
since = "2026-10-06"
reason = "maralcbr has no time or machines for the pool (#332): one active maintainer and one host until more maintainers join"

# The maintainers' co-signature (#330, design v2 D1 b and D25). Beside
# release.yml's keyless signature, every host bundle a host agent takes
# carries the signature of `threshold` of the keys below, and a rollback
# statement that goes back more than 14 days carries at least one: each
# made offline on a FIDO security key, with a touch (`ssh-keygen -t
# ed25519-sk`, or `-t ecdsa-sk` on a key without Ed25519; `factory/bin/co-sign
# release vX.Y.Z` signs a draft release). A key per maintainer, under their
# login, as `ssh-keygen` writes the `.pub` file, or a list of them: a backup
# security key beside their own, either of which is their one co-signature.
# factory/bin/check-governance --write pins this table into the host agent
# (crates/omarchy-agent/src/verify/maintainers.toml): an agent requires what
# the release it shipped in pinned, so a change here is a new agent, taken
# under the old one's requirement — one key changed per release, and never a
# threshold one lost key would leave out of reach (check-governance refuses
# it; the runbook, *Co-signing a release*). threshold = 0 asks nothing of a
# bundle yet; 1 is 1-of-N, 2 is 2-of-N (with two maintainers, only once each
# has a backup key).
[cosignature]
threshold = 0

[cosignature.keys]
# firemanxbr = "sk-ssh-ed25519@openssh.com AAAAGnNrLXNzaC1lZDI1NTE5QG9wZW5zc2guY29t... firemanxbr@security-key"
# maralcbr = ["sk-ssh-ed25519@openssh.com AAAA... maralcbr@security-key", "sk-ecdsa-sha2-nistp256@openssh.com AAAA... maralcbr@backup"]
