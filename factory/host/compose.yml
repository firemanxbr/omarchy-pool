# The project's own host — two workers of each role, one per architecture
# (/docs/runbook, *The Studio host*; the roles: /docs/workers#roles).
#
#   docker compose up -d            start
#   ./rollout.sh                    a rolling upgrade to the latest image, one worker at a time
#                                   (a systemd user timer runs it every 15 minutes: setup.sh)
#   docker compose logs -f review-aarch64            one worker's log
#
# Everything lives under POOL_ROOT (.env, written by setup.sh): the work
# directories (the same path on the host and inside a project worker, so the
# sibling build containers it starts can mount subdirectories), one pacman
# package cache per architecture, one build cache (cargo, Go, ccache) per
# trust and architecture, and etc/ with the secrets — a worker token per
# worker (register.sh writes them) and the agent key (etc/agent.env, yours).
#
# Where the secrets live, and where they do not (/docs/security-model, *Isolation*):
# the agent key and GITHUB_TOKEN are read by three containers that run no
# build — agent-proxy, and the two community brokers, which also hold their
# builder's worker token. The community builders hold nothing and reach
# their broker over a network of their own; the review workers hold their
# token and the runtime's socket, and their build containers hold nothing,
# reaching agent-proxy over the `review` network.
#
# The host is aarch64: the pool and review workers run natively (an x86_64
# pool job is only a label; an x86_64 rebuild starts an emulated sibling
# container), the x86_64 community builder is itself an emulated container.

# A stop is a drain: the worker finishes the task it holds, claims no new
# one and exits (SIGTERM); the grace period is what the longest build may
# take — rollout.sh replaces the six one at a time inside it.
x-project: &project
  image: ghcr.io/firemanxbr/omarchy-worker:latest
  restart: unless-stopped
  stop_grace_period: 3h
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ${POOL_ROOT:-/srv/omarchy-pool}:${POOL_ROOT:-/srv/omarchy-pool}
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "3" }

services:
  pool-x86_64:
    <<: *project
    env_file: [etc/pool-x86_64.env]
    environment:
      OMARCHY_WORKER_ROLE: pool
      OMARCHY_WORK_DIR: ${POOL_ROOT:-/srv/omarchy-pool}/work/pool-x86_64
      OMARCHY_PKG_CACHE: ${POOL_ROOT:-/srv/omarchy-pool}/cache/pacman
      WORKER_LABELS: '{"where":"${WHERE:-omarchy-studio}"}'
  pool-aarch64:
    <<: *project
    env_file: [etc/pool-aarch64.env]
    environment:
      OMARCHY_WORKER_ROLE: pool
      OMARCHY_WORK_DIR: ${POOL_ROOT:-/srv/omarchy-pool}/work/pool-aarch64
      OMARCHY_PKG_CACHE: ${POOL_ROOT:-/srv/omarchy-pool}/cache/pacman
      WORKER_LABELS: '{"where":"${WHERE:-omarchy-studio}"}'

  review-x86_64:
    <<: *project
    profiles: [emulated]
    env_file: [etc/review-x86_64.env]
    depends_on: [agent-proxy]
    networks: [default, review]
    environment:
      OMARCHY_WORKER_ROLE: review
      OMARCHY_WORK_DIR: ${POOL_ROOT:-/srv/omarchy-pool}/work/review-x86_64
      # The audits here, and the agent inside the review builds, go through
      # agent-proxy — the key stays there; the build containers are started
      # on the `review` network, where agent-proxy is all there is to reach,
      # and read GitHub through it too.
      FACTORY_PROVIDER: anthropic
      ANTHROPIC_BASE_URL: http://agent-proxy:8790
      ANTHROPIC_API_KEY: via-agent-proxy
      OMARCHY_BUILD_ENV: "FACTORY_PROVIDER=anthropic,ANTHROPIC_BASE_URL=http://agent-proxy:8790,ANTHROPIC_API_KEY=via-agent-proxy,GITHUB_API=http://agent-proxy:8790/github"
      OMARCHY_BUILD_NETWORK: ${COMPOSE_PROJECT_NAME:-omarchy-pool}_review
      OMARCHY_PKG_CACHE: ${POOL_ROOT:-/srv/omarchy-pool}/cache/pacman
      OMARCHY_BUILD_CACHE: ${POOL_ROOT:-/srv/omarchy-pool}/cache/build
      WORKER_LABELS: '{"where":"${WHERE:-omarchy-studio}","emulated":true}'
  review-aarch64:
    <<: *project
    env_file: [etc/review-aarch64.env]
    depends_on: [agent-proxy]
    networks: [default, review]
    environment:
      OMARCHY_WORKER_ROLE: review
      OMARCHY_WORK_DIR: ${POOL_ROOT:-/srv/omarchy-pool}/work/review-aarch64
      # The audits here, and the agent inside the review builds, go through
      # agent-proxy — the key stays there; the build containers are started
      # on the `review` network, where agent-proxy is all there is to reach,
      # and read GitHub through it too.
      FACTORY_PROVIDER: anthropic
      ANTHROPIC_BASE_URL: http://agent-proxy:8790
      ANTHROPIC_API_KEY: via-agent-proxy
      OMARCHY_BUILD_ENV: "FACTORY_PROVIDER=anthropic,ANTHROPIC_BASE_URL=http://agent-proxy:8790,ANTHROPIC_API_KEY=via-agent-proxy,GITHUB_API=http://agent-proxy:8790/github"
      OMARCHY_BUILD_NETWORK: ${COMPOSE_PROJECT_NAME:-omarchy-pool}_review
      OMARCHY_PKG_CACHE: ${POOL_ROOT:-/srv/omarchy-pool}/cache/pacman
      OMARCHY_BUILD_CACHE: ${POOL_ROOT:-/srv/omarchy-pool}/cache/build
      WORKER_LABELS: '{"where":"${WHERE:-omarchy-studio}"}'

  # The agent and GitHub for the review workers (their audits) and for the
  # build containers they start (the project's review builds): a broker
  # with no worker token (factory/bin/broker, OMARCHY_WORKER_ROLE=agent),
  # native — Claude Code's binary dies under qemu — reached in the Anthropic
  # Messages shape agent.py already knows, with a key that is a placeholder
  # it never reads. Only on the `review` network.
  agent-proxy:
    image: ghcr.io/firemanxbr/omarchy-worker:aarch64
    restart: unless-stopped
    env_file: [etc/agent.env]
    environment:
      OMARCHY_WORKER_ROLE: agent
    networks: [review]
    logging: *logging

  # A community worker is a pair: the broker holds the worker's token, the
  # agent key and GITHUB_TOKEN and only receives, processes and answers —
  # the pool's calls for the one task it claimed, the agent, GitHub
  # read-only; the builder beside it holds nothing, builds one task in its
  # own container (the restart policy starts the next one) and reaches the
  # broker over a network the two have to themselves. No socket, no work
  # directory — the package cache of its architecture (pacman checks every
  # file against the signed database) and a build cache of its own:
  # cache/build/community/<arch>, never the project's (cache/build/project/
  # <arch>, where the review workers' build containers keep theirs). What a
  # stranger's build writes to cargo's registry or ccache, only a stranger's
  # build reads — and inside, one directory per package.
  #
  # The `emulated` profile: x86_64 *builds* on an aarch64 host run under
  # user-mode emulation, and on a 16K-page kernel (Asahi) that cannot load
  # every x86_64 library — rustc, sudo and anything linking libedit or
  # libldap fail to map a segment. Off by default here: x86_64 build tasks
  # wait for an x86_64 worker (any x86_64 machine with docker and these two
  # services' env files). COMPOSE_PROFILES=emulated in .env turns them on.
  # The x86_64 pair's broker runs natively (the aarch64 image): the agent
  # never runs under qemu.
  broker-community-x86_64:
    profiles: [emulated]
    image: ghcr.io/firemanxbr/omarchy-worker:aarch64
    restart: unless-stopped
    env_file: [etc/agent.env, etc/community-x86_64.env]
    environment:
      OMARCHY_WORKER_ROLE: broker
    networks: [community-x86_64]
    logging: *logging
  community-x86_64:
    profiles: [emulated]
    image: ghcr.io/firemanxbr/omarchy-worker:x86_64
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 3h
    depends_on: [broker-community-x86_64]
    environment:
      OMARCHY_WORKER_ROLE: community
      OMARCHY_BROKER: http://broker-community-x86_64:8790
      WORKER_LABELS: '{"where":"${WHERE:-omarchy-studio}","emulated":true}'
    volumes:
      - ${POOL_ROOT:-/srv/omarchy-pool}/cache/pacman/x86_64:/var/cache/pacman/pkg
      - ${POOL_ROOT:-/srv/omarchy-pool}/cache/build/community/x86_64:/build/cache
    networks: [community-x86_64]
    logging: *logging
  broker-community-aarch64:
    image: ghcr.io/firemanxbr/omarchy-worker:aarch64
    restart: unless-stopped
    env_file: [etc/agent.env, etc/community-aarch64.env]
    environment:
      OMARCHY_WORKER_ROLE: broker
    networks: [community-aarch64]
    logging: *logging
  community-aarch64:
    image: ghcr.io/firemanxbr/omarchy-worker:aarch64
    restart: unless-stopped
    stop_grace_period: 3h
    depends_on: [broker-community-aarch64]
    environment:
      OMARCHY_WORKER_ROLE: community
      OMARCHY_BROKER: http://broker-community-aarch64:8790
      WORKER_LABELS: '{"where":"${WHERE:-omarchy-studio}"}'
    volumes:
      - ${POOL_ROOT:-/srv/omarchy-pool}/cache/pacman/aarch64:/var/cache/pacman/pkg
      - ${POOL_ROOT:-/srv/omarchy-pool}/cache/build/community/aarch64:/build/cache
    networks: [community-aarch64]
    logging: *logging

# One network per pair, and one for the review side: a builder reaches its
# broker and the internet, nothing else of the host's.
networks:
  review: {}
  community-x86_64: {}
  community-aarch64: {}
