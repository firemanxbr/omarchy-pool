name: E2E

# Real pacman in an Arch container, on native x86_64 runners (no emulation).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  pacman-local:
    name: E2E pacman (local mirror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: tests/e2e-pacman.sh

  worker-local:
    name: E2E worker (publish, promote, render, pacman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      # libfaketime: the orders scenario B runs a worker whose clock is ten minutes fast (#277).
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends faketime
      - run: tests/e2e-worker.sh

  thin-client:
    name: E2E thin client (safe, blocked, upgrade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: tests/e2e-client.sh
