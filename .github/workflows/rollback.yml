name: Rollback

# The pool back to an earlier release, from anywhere (#277): the worker
# images and the Worker together, because a pool left at the newer release
# refuses the older images as outdated. Dispatched by a maintainer, never by
# a merge:
#
#   gh workflow run rollback.yml -f to=v1.0.2
#
# factory/bin/release-rollback does the work (tests/rollback-workflow.sh
# holds it). Before anything moves: that release's multi-arch `:vX.Y.Z`
# exists (a release writes it only once both architectures started every
# role, so one whose smoke start failed is refused), and its Worker installs
# and builds. Then `:x86_64` and `:aarch64` re-pointed at that release's
# `:<arch>-vX.Y.Z` images, and `:latest` at its `:vX.Y.Z`, each signed; the
# Worker deployed from the tag with POOL_VERSION set to it (no migration:
# they are forward-only) — a deploy that fails puts the tags back where they
# were; a `deploy` event; the running version checked. Then every updater
# sees the pool's release change within two minutes and follows it down, as
# it follows a release up. The same permissions and environment as
# release.yml's image and deploy jobs, and its concurrency group: a rollback
# and a release never run at once.
on:
  workflow_dispatch:
    inputs:
      to:
        description: "the release to go back to (vX.Y.Z, an existing tag)"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  rollback:
    name: Roll back to ${{ github.event.inputs.to }}
    runs-on: ubuntu-latest
    environment:
      name: pool
      url: https://omarchy-pool.org
    env:
      TO: ${{ github.event.inputs.to }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/omarchy-worker
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OMARCHY_API: ${{ vars.OMARCHY_API }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: sigstore/cosign-installer@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: The images and the Worker back to the release
        run: bash factory/bin/release-rollback "$TO"
