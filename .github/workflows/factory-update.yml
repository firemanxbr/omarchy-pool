name: Factory update

# The project's own PKGBUILDs (factory/pkgbuilds/<name>/) follow their
# upstreams by pull request: this checks each one's GitHub releases, bumps
# pkgver (pkgrel back to 1), refreshes the checksums in an Arch container
# and opens one pull request per package. A maintainer reviews it
# (CODEOWNERS; main requires that review) — nothing is auto-merged — and
# the merge queues the build (the hourly `enqueue` job). Runs daily from
# the pool's scheduler. Packages contributors registered are bumped
# differently: on their own workers, as evidence (docs/GOVERNANCE.md).
#
# Needs the repository setting: Actions may create pull requests.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "package name to check — empty checks everything"
        required: false
  schedule:
    - cron: "45 5 * * *"

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    name: Bump what upstream released
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check upstreams
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          factory/bin/check-updates > /tmp/updates || true
          if [[ -n "${{ inputs.package }}" ]]; then grep "^${{ inputs.package }} " /tmp/updates > /tmp/only || true; mv /tmp/only /tmp/updates; fi
          cat /tmp/updates
          echo "count=$(wc -l < /tmp/updates | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - name: Bump, refresh checksums, open pull requests
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "omarchy-pool factory"
          git config user.email "factory@omarchy-pool.invalid"
          while read -r pkg current latest; do
            dir="factory/pkgbuilds/$pkg"; name="$pkg"; branch="factory/bump-$name-$latest"
            if gh pr list --head "$branch" --state open --json number -q 'length' | grep -qv '^0$'; then echo "$pkg $latest: pull request already open"; continue; fi
            git checkout -q -B "$branch" origin/main
            sed -i -E "s/^pkgver=.*/pkgver=$latest/; s/^pkgrel=.*/pkgrel=1/" "$dir/PKGBUILD"
            # updpkgsums downloads the sources and rewrites the sha256sums arrays.
            docker run --rm -v "$PWD/$dir:/pkg" -w /pkg docker.io/library/archlinux:base-devel bash -c '
              sed -i -e "s/^#\?DisableSandboxSyscalls/DisableSandboxSyscalls/" -e "s/^#\?DisableSandboxFilesystem/DisableSandboxFilesystem/" /etc/pacman.conf
              pacman -Sy --noconfirm --needed pacman-contrib >/dev/null && useradd -m b && chown -R b /pkg && sudo -u b updpkgsums' 2>&1 | tail -3
            # Only the recipe goes on the record: updpkgsums leaves the downloaded sources beside it (hey-cli 1.5.0 carried two tarballs into its pull request, 2026-09-17).
            git add "$dir/PKGBUILD" && git commit -q -m "factory: $name $current → $latest" -m "Automatic bump of an approved package after an upstream release." || { echo "$pkg: nothing changed"; continue; }
            git clean -fdq -- "$dir"
            git push -q -f origin "$branch"
            url="$(gh pr create --base main --head "$branch" --title "factory: $name $current → $latest" \
              --body "Upstream released **$latest** (this PKGBUILD had $current). pkgver bumped, pkgrel reset, checksums refreshed with updpkgsums. Opened by the Factory update workflow for a maintainer to review; the merge queues the build.")"
            echo "$pkg: $url"
            # A pull request opened with the workflow token does not start
            # pull_request workflows by itself; run the required checks on the branch.
            gh workflow run ci.yml --ref "$branch" || true
            gh workflow run e2e.yml --ref "$branch" || true
          done < /tmp/updates
