name: Release

# A release is decided, not implied by a merge (2026-09-17): main takes the
# pull requests as they are ready — from one session or three — and a
# maintainer cuts one release that carries them all, from the Actions page
# or `gh workflow run release.yml` (`-f bump=minor|major` for a bigger step).
# CI and E2E run again on main's head, the next version is derived from the
# last tag (patch by default; the head commit's pull request label
# `release:minor` or `release:major`, or the bump given, moves the other
# numbers), binaries are built for both architectures, a GitHub release is
# created as a draft with notes from every pull request since the last tag
# (carrying build-images.json: the task build images, resolved to digests,
# #312), the worker image is pushed for both architectures — as
# `:<arch>-vX.Y.Z` first, every role started from it on the runner
# (tests/image-smoke.sh), and only once
# both architectures' have started, `:<arch>` and `:latest` (#277: an image
# that does not start stops here, before any host can pull it, on either
# architecture) — then the signed host bundle every maintainer host takes
# (#311: the omarchy-agent binaries, omarchy-host-vX.Y.Z.tar.gz signed
# keyless, install.sh) is verified with the agents the fleet runs and added
# to the draft, the release is published (immutable from then on) once
# every asset is on it, and the worker is deployed carrying that
# version: every set's updater follows it within two minutes. Versions start
# at v0.0.1 and grow one step at a time. A merge alone changes nothing that
# runs. Going back is rollback.yml.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch | minor | major (overrides the pull request label)"
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

# Read-only by default: only publish writes contents (the tag and the
# release), only the image jobs write packages (#308).
permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  e2e:
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  version:
    name: Next version
    # The gate every other job waits behind (#308): the release environment
    # admits main only and waits for a maintainer's approval, so a dispatch
    # from another branch is refused, and one from main waits, before
    # anything is built, tagged, published or pushed. worker-image-manifest
    # sits in it again, for its OIDC token.
    needs: [ci, e2e]
    environment: release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      previous: ${{ steps.next.outputs.previous }}
      bump: ${{ steps.next.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_INPUT: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail
          previous=$(git tag --list 'v*' --sort=-v:refname | head -1)
          existing=$(git tag --points-at HEAD --list 'v*' | head -1)
          bump="$BUMP_INPUT"
          if [[ -z "$bump" ]]; then
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[].labels[].name' 2>/dev/null || true)
            if grep -qx 'release:major' <<<"$labels"; then bump=major
            elif grep -qx 'release:minor' <<<"$labels"; then bump=minor
            else bump=patch; fi
          fi
          if [[ -n "$existing" ]]; then
            version="$existing"; bump=none
          elif [[ -z "$previous" ]]; then
            version=v0.0.1
          else
            IFS=. read -r major minor patch <<<"${previous#v}"
            case "$bump" in
              major) version="v$((major + 1)).0.0" ;;
              minor) version="v$major.$((minor + 1)).0" ;;
              patch) version="v$major.$minor.$((patch + 1))" ;;
              *) echo "unknown bump '$bump'"; exit 1 ;;
            esac
          fi
          echo "previous=$previous version=$version bump=$bump"
          { echo "previous=$previous"; echo "version=$version"; echo "bump=$bump"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      POOL_VERSION: ${{ needs.version.outputs.version }}
      POOL_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p pkg-extract -p pkg-repo -p omarchy-cli
      - name: Package
        run: |
          set -euo pipefail
          name="omarchy-pool-${POOL_VERSION}-${{ matrix.arch }}-linux"
          mkdir -p "dist/$name"
          cp target/release/pkg-extract target/release/pkg-repo target/release/omarchy-cli "dist/$name/"
          cp README.md LICENSE docs/omarchy-staging.pub.asc "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          "dist/$name/omarchy-cli" --version
          "dist/$name/pkg-repo" --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  agent:
    name: Host agent (${{ matrix.target }})
    # The omarchy-agent binary per platform (#311, design v2 §4.4), built by
    # factory/bin/build-agent, the build tests/agent-reproducible.sh checks:
    # an unchanged agent keeps its hash from release to release. Nothing
    # signs here: host-bundle puts each binary's SHA-256 in
    # the signed manifest and install.sh, and attests their provenance, in the
    # release environment.
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: omarchy-agent-x86_64-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: omarchy-agent-aarch64-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: omarchy-agent-aarch64-darwin
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml. Pinned by commit: this binary is
      # what every host trusts (the build job's @master is a follow-up).
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - name: musl's C compiler, for aws-lc
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build (musl's allocator on Linux, signed ad hoc on macOS)
        run: bash factory/bin/build-agent ${{ matrix.target }} agent/${{ matrix.asset }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.asset }}
          path: agent/${{ matrix.asset }}
          if-no-files-found: error

  build-images:
    name: Task build images by digest
    # The image every task's build container starts from, one per
    # architecture, resolved to the digest its tag names now (#312,
    # factory/bin/build-images): a tag that does not resolve fails the
    # release before anything is published. The release attaches
    # build-images.json (the manifest's inner.images.build), uploaded with
    # the release itself (immutable releases): what the host bundle renders
    # into the host set's dispatcher as OMARCHY_BUILD_IMAGE_AARCH64 and
    # OMARCHY_BUILD_IMAGE_X86_64. The job summary shows both digests. The
    # runner's own buildx answers; no setup action joins this job.
    # Its outputs, the two digests, are what host-bundle renders and writes
    # into manifest.json (#311): the same digests the release carries.
    needs: version
    runs-on: ubuntu-latest
    outputs:
      aarch64: ${{ steps.resolve.outputs.aarch64 }}
      x86_64: ${{ steps.resolve.outputs.x86_64 }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          set -euo pipefail
          mkdir -p dist && factory/bin/build-images dist/build-images.json
          jq -r '"aarch64=\(.aarch64)", "x86_64=\(.x86_64)"' dist/build-images.json >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-build-images
          path: dist/build-images.json
          if-no-files-found: error

  publish:
    name: GitHub release (a draft)
    # Created as a draft (#311): assets can still be added to it (host-bundle
    # adds the agents, the signed host bundle and install.sh) and nobody
    # downloads from it yet. publish-release publishes it, which makes it
    # immutable, once every asset is on it; a release that stops before then
    # stays a draft. build-images.json (#312) is attached here, with the
    # binaries, in the step that creates the draft.
    needs: [version, build, build-images]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Refuse a release this run did not make
        # Any collaborator with write access can make a v* tag and a release
        # (#351: this user-owned repository cannot restrict creation). A
        # published release is immutable and its host bundle names its images,
        # which a second run would push again, so it is refused, never reused:
        # a run that stopped after publishing resumes with "Re-run failed jobs"
        # on that run, not with a new dispatch (tests/release-workflow.sh). A
        # draft has no tag yet and nothing downloads from it; the next step
        # makes it again, so the release carries only bytes this run built.
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1 && [[ "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" != true ]]; then
            echo "::error::release $VERSION is already published and cannot change; re-run the failed jobs of its run instead"; exit 1
          fi
          # A tag anyone with write access pushed at another commit would be taken
          # over: gh release create ignores --target for an existing tag (#351).
          # git ls-remote prints nothing for a tag that does not exist and fails
          # the step when it cannot ask, so an error is never read as a commit
          # (v1.0.6's first run read gh api's 404 body as one). The last line is
          # the commit, also for an annotated tag (its peeled ^{} line).
          at="$(git ls-remote --tags origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}" | awk 'END { print $1 }')"
          if [[ -n "$at" && "$at" != "$GITHUB_SHA" ]]; then
            echo "::error::tag $VERSION already points at $at, not at $GITHUB_SHA: this run does not take it over"; exit 1
          fi
      - name: Create the release (a draft)
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            # A draft an earlier run left (it stopped before publish-release), or
            # one made by hand: it may name another commit and carry other assets,
            # so it is made again. Deleting a draft removes no tag.
            echo "release $VERSION is a draft from an earlier run: making it again for $GITHUB_SHA"
            gh release delete "$VERSION" --yes
          fi
          args=(--draft --target "$GITHUB_SHA" --title "$VERSION" --generate-notes)
          [[ -n "$PREVIOUS" ]] && args+=(--notes-start-tag "$PREVIOUS")
          gh release create "$VERSION" "${args[@]}" dist/* docs/omarchy-staging.pub.asc

  worker-image:
    name: Worker image (${{ matrix.arch }})
    # The one image every worker runs — a contributor's or a maintainer's,
    # the registration decides — built from the binaries this release just
    # published and tagged with its version. Pushed as the version's tag
    # only, then every role is started from it on this runner (#277): the
    # project worker through its entrypoint to its first claim, the broker
    # answering, the builder's and the updater's self-tests. No tag a host
    # follows moves here: the manifest job moves them all, once both
    # architectures' smoke starts passed (tests/release-workflow.sh).
    # It signs nothing, so it gets no OIDC token (no id-token: write) and no
    # cosign: only worker-image-manifest signs, in the release environment.
    # The release is still a draft here (#311), so the build takes the
    # binaries it publishes from this run's artifacts, served from the
    # runner (TOOLS_URL), as CI's local image build does. It still waits for
    # publish: a run on a commit whose release is already published (and
    # immutable) stops there, before any image tag is pushed or moved.
    # Each leg hands the digest it pushed to host-bundle (image-digest-<arch>),
    # which signs that digest, never what a tag says hours later.
    needs: [version, build, publish]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            # Base images by digest (#308): the tag is kept for the reader, the digest is what pulls.
            base: docker.io/library/archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
          - arch: aarch64
            runner: ubuntu-24.04-arm
            base: docker.io/menci/archlinuxarm:base-devel@sha256:4d3531dbac23dbe21aeae9372aafe474f506ec4fb5d453b3e7c5ce3440041954
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/omarchy-worker
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist
      - name: Build, push the version's tag only
        run: |
          set -euo pipefail
          (cd dist && exec python3 -m http.server 8765 --bind 127.0.0.1) >/dev/null 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          tag="$IMAGE:${{ matrix.arch }}"
          docker build --network host -f factory/image/Containerfile --build-arg BASE="${{ matrix.base }}" --build-arg ARCH="${{ matrix.arch }}" --build-arg POOL_RELEASE="$VERSION" \
            --build-arg TOOLS_URL=http://127.0.0.1:8765 -t "$tag-$VERSION" .
          docker push "$tag-$VERSION"
      - name: Record the digest it pushed
        run: |
          set -euo pipefail
          mkdir -p image-digest
          docker buildx imagetools inspect "$IMAGE:${{ matrix.arch }}-$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"' > "image-digest/${{ matrix.arch }}"
          cat "image-digest/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: image-digest/${{ matrix.arch }}
          if-no-files-found: error
      - name: Every role starts from it, before any tag a host follows moves
        run: bash tests/image-smoke.sh "$IMAGE:${{ matrix.arch }}-$VERSION"

  worker-image-manifest:
    name: Worker image (both architectures)
    # Only once both architectures' images started every role: one
    # architecture's smoke start that fails moves no tag at all, not even
    # the other architecture's (the Studio's builders, brokers and agent
    # proxy follow :aarch64). First the version's own multi-arch tag, which
    # says both smoke starts passed (rollback.yml goes back only to a
    # release that has it); then :x86_64 and :aarch64, each a copy of its
    # version's image; then :latest, which every set's updater follows.
    # Each signed keyless, by one exact cosign against the public-good
    # Fulcio and Rekor named on every call (#308; rollback.yml and
    # factory/bin/release-rollback carry the same pins, tests/trust-pins.sh
    # holds them). The identity is this file on main:
    # https://github.com/firemanxbr/omarchy-pool/.github/workflows/release.yml@refs/heads/main.
    # The release environment admits main only and waits for a maintainer's
    # approval (runbook, *The GitHub settings the signature relies on*).
    needs: [version, worker-image]
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    # The version's index digest, for host-bundle (#311): it signs this
    # digest into the bundle, not whatever :vX.Y.Z points at after its review.
    outputs:
      index: ${{ steps.tags.outputs.index }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/omarchy-worker
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish the version tag, move the architectures' tags and latest, sign them
        id: tags
        run: |
          set -euo pipefail
          sign() { cosign sign --yes --fulcio-url=https://fulcio.sigstore.dev --rekor-url=https://rekor.sigstore.dev "$IMAGE@$(docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' | tr -d '"')"; }
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:x86_64-$VERSION" "$IMAGE:aarch64-$VERSION"
          sign "$IMAGE:$VERSION"
          echo "index=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"
          for arch in x86_64 aarch64; do
            docker buildx imagetools create --prefer-index=false -t "$IMAGE:$arch" "$IMAGE:$arch-$VERSION"
            sign "$IMAGE:$arch"
          done
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$VERSION"
          sign "$IMAGE:latest"

  host-bundle:
    name: Host bundle (signed, verified with the fleet's agents)
    # What every maintainer host takes from the release (#311, design v2
    # §4.4, §5.1), made and signed here, in the reviewed release environment,
    # by the one exact cosign every signature uses:
    #  1. the agent binaries are this commit's agent, and their provenance is
    #     attested; the container tools the manifest pins match their
    #     downloads;
    #  2. lint-set passes on every set as written (the template the agent
    #     lints, factory/sets/*), then factory/bin/host-bundle renders the
    #     image placeholders to digests (the worker image's index as
    #     worker-image-manifest signed it and each platform's manifest as
    #     worker-image pushed it, both handed over by the jobs, never re-read
    #     from a tag; each platform's config; the task build images) and
    #     writes manifest.json (factory/bundle/manifest.toml's capacity
    #     constants, pins and floor), omarchy-host-vX.Y.Z.tar.gz and
    #     install.sh with the three agent SHA-256;
    #  3. cosign sign-blob --bundle signs it (and a probe: the same bundle
    #     with one more outer field);
    #  4. the agent binaries' and install.sh's provenance is attested (a
    #     branch's copy of this file attests @refs/heads/<branch>, which the
    #     runbook's verifying install and verify-with-agents refuse), and
    #     the signed bundle, the probe and install.sh are handed to
    #     verify-agents as an artifact.
    # It runs no binary but this run's own agent: the earlier agents run in
    # verify-agents, which holds no signing token.
    needs: [version, publish, agent, worker-image-manifest, build-images]
    environment: release
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/omarchy-worker
      VERSION: ${{ needs.version.outputs.version }}
      # The task build images by digest (#312): what the build-images job
      # resolved and the release carries as build-images.json, rendered into
      # the host set's dispatcher (@BUILD_AARCH64@, @BUILD_X86_64@) and
      # written into manifest.json's inner.images.build.
      BUILD_AARCH64: ${{ needs.build-images.outputs.aarch64 }}
      BUILD_X86_64: ${{ needs.build-images.outputs.x86_64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.5
      # `docker buildx imagetools` is the runner's own buildx plugin: no
      # builder to set up, so no unpinned action runs with this job's tokens.
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: actions/download-artifact@v4
        with:
          path: agents
          pattern: agent-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: image-digest
          pattern: image-digest-*
          merge-multiple: true
      - name: The agent binaries are this commit's agent
        run: |
          set -euo pipefail
          chmod 755 agents/*
          want="omarchy-agent $(python3 -c 'import tomllib; print(tomllib.load(open("crates/omarchy-agent/Cargo.toml", "rb"))["package"]["version"])')"
          got="$(agents/omarchy-agent-x86_64-linux-musl --version)"
          [[ "$got" == "$want" ]] || { echo "the built agent says $got, crates/omarchy-agent says $want"; exit 1; }
          sha256sum agents/*
      - name: The container tools match their pinned SHA-256
        run: factory/bin/host-bundle check-tools
      - name: Lint every set, write the bundle and install.sh
        env:
          INDEX: ${{ needs.worker-image-manifest.outputs.index }}
        run: |
          set -euo pipefail
          for set in factory/sets/*/; do agents/omarchy-agent-x86_64-linux-musl lint-set "$set"; done
          factory/bin/host-bundle worker-image "$IMAGE" "$VERSION" --index "$INDEX" \
            --aarch64 "$(cat image-digest/aarch64)" --x86_64 "$(cat image-digest/x86_64)" > worker.json
          printf '{"aarch64": "%s", "x86_64": "%s"}\n' "$BUILD_AARCH64" "$BUILD_X86_64" > build-images.json
          factory/bin/host-bundle build --release "$VERSION" --worker worker.json --build-images build-images.json \
            --agents agents --out out --probe
          cat out/manifest.json
      - name: Sign the bundle and the probe
        run: |
          set -euo pipefail
          for b in "out/omarchy-host-$VERSION.tar.gz" "out/probe/omarchy-host-$VERSION.tar.gz"; do
            cosign sign-blob --yes --fulcio-url=https://fulcio.sigstore.dev --rekor-url=https://rekor.sigstore.dev --new-bundle-format --bundle "$b.sigstore.json" "$b"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            agents/omarchy-agent-*
            out/install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: host-bundle
          path: |
            out/omarchy-host-${{ env.VERSION }}.tar.gz
            out/omarchy-host-${{ env.VERSION }}.tar.gz.sigstore.json
            out/install.sh
            out/probe/omarchy-host-${{ env.VERSION }}.tar.gz
            out/probe/omarchy-host-${{ env.VERSION }}.tar.gz.sigstore.json
          if-no-files-found: error

  verify-agents:
    name: Host bundle verified with the fleet's agents
    # factory/bin/verify-with-agents (#311, design v2 §4.4, §5.1) runs
    # omarchy-agent verify with the production pins on the signed bundle and
    # the probe, with the new agent and every agent released in the last 30
    # days: any refusal fails the release here, before anything is added to
    # the draft. It runs binaries from earlier releases, so only those
    # attested by this file on refs/heads/main, and in a job of its own:
    # read-only, outside the release environment, with no OIDC token, so no
    # agent ever runs next to the signing identity or a token that writes.
    needs: [version, agent, host-bundle]
    permissions:
      contents: read
      attestations: read
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agent-omarchy-agent-x86_64-linux-musl
          path: agents
      - uses: actions/download-artifact@v4
        with:
          name: host-bundle
          path: out
      - name: Verify with the new agent and every agent of the last 30 days
        run: |
          chmod 755 agents/omarchy-agent-x86_64-linux-musl
          bash factory/bin/verify-with-agents "out/omarchy-host-$VERSION.tar.gz" "out/probe/omarchy-host-$VERSION.tar.gz" agents/omarchy-agent-x86_64-linux-musl

  host-bundle-upload:
    name: Host bundle added to the draft
    # Only once verify-agents passed: the agents, the signed host bundle and
    # install.sh, from this run's artifacts. It runs no binary, and holds no
    # OIDC token.
    needs: [version, host-bundle, verify-agents]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: agents
          pattern: agent-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: host-bundle
          path: out
      - name: Add them to the draft
        run: |
          set -euo pipefail
          gh release upload "$VERSION" --clobber agents/omarchy-agent-x86_64-linux-musl agents/omarchy-agent-aarch64-linux-musl agents/omarchy-agent-aarch64-darwin \
            "out/omarchy-host-$VERSION.tar.gz" "out/omarchy-host-$VERSION.tar.gz.sigstore.json" out/install.sh

  publish-release:
    name: Publish the release (immutable from here)
    # Only once host-bundle signed, verify-agents verified and
    # host-bundle-upload added the host bundle (#311):
    # factory/bin/publish-release checks that every asset is on the draft
    # and is the bytes this run made (hashed here from the run's own
    # artifacts: a draft's asset can still be replaced by any token that
    # writes contents), then publishes it, which makes it immutable. A job
    # that fails before leaves the release a draft, and the pool on the
    # previous release (deploy needs this job), so follow.latest never names
    # a release whose bundle does not exist.
    needs: [version, host-bundle-upload]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: made
          pattern: dist-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: made
          pattern: agent-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: host-bundle
          path: made
      - name: The SHA-256 of every file this run made
        run: |
          set -euo pipefail
          cp docs/omarchy-staging.pub.asc made/
          (cd made && for f in *; do if [[ -f "$f" ]]; then sha256sum "$f"; fi; done) > sums
          cat sums
      - run: factory/bin/publish-release "${{ needs.version.outputs.version }}" sums

  deploy:
    name: Deploy worker
    # After the images: the Worker's deploy time starts the 45-minute grace after which
    # the pool refuses workers on the previous image (worker/src/update.ts) — the image
    # they must pull has to exist first, on both architectures and under :latest.
    # And last (#311): after the release is published with its host bundle.
    needs: [version, worker-image-manifest, publish-release]
    runs-on: ubuntu-latest
    environment:
      name: pool
      url: https://omarchy-pool.org
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OMARCHY_API: ${{ vars.OMARCHY_API }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - name: Migrate and deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply omarchy-repo --remote
          npx wrangler deploy \
            --var "POOL_VERSION:$VERSION" \
            --var "POOL_COMMIT:$GITHUB_SHA" \
            --var "POOL_DEPLOYED_AT:$(date -u +%FT%TZ)"
      - name: Verify the running version
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            running=$(curl -sf "$OMARCHY_API/api/v1/version" | jq -r .version || true)
            [[ "$running" == "$VERSION" ]] && { echo "running $running"; exit 0; }
            sleep 5
          done
          echo "expected $VERSION, got ${running:-nothing}"; exit 1
      - name: Record the deploy
        # Straight into the index with the same Cloudflare token that deployed:
        # the release workflow holds no credential of the pool's API.
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: |
          payload="$(jq -nc --arg v "$VERSION" --arg sha "$GITHUB_SHA" --arg bump "${{ needs.version.outputs.bump }}" \
                  --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                  --arg rel "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$VERSION" \
                  '{version: $v, commit: $sha, bump: $bump, run_url: $run, release_url: $rel}' | sed "s/'/''/g")"
          npx wrangler d1 execute omarchy-repo --remote --command \
            "INSERT INTO events (kind, status, summary, payload) VALUES ('deploy', 'ok', 'omarchy-pool $VERSION deployed', '$payload')" >/dev/null
      - name: Not deployed
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set — release $VERSION was published but the worker was not deployed (https://omarchy-pool.org/docs/runbook, Releasing the pool itself)."
