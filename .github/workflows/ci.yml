name: CI

# Runs on every pull request; the Release workflow calls it again on main
# before it cuts a version (direct pushes to main are blocked by the ruleset).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: The host set passes lint-set, its set.toml is schema 3, and docker compose loads it with the placeholders filled
        run: bash tests/host-set.sh
      - name: The host bundle's writer — the manifest with its capacity block, the set rendered to digests, a reproducible archive, install.sh — and the agent reads what it writes
        run: python3 tests/host-bundle.py
      - name: The agent's capacity probes on docker, inside a systemd scope with CPUQuota and MemoryMax, and on rootless podman — both free-disk values and the limits
        run: |
          command -v podman >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q podman; }
          bash tests/agent-capacity.sh
      - run: cargo build --release -p pkg-extract -p pkg-repo -p omarchy-cli
      - name: The Rust worker sends a build that died of emulation back for a native one, against a stubbed pool and podman
        run: bash tests/worker-needs-native.sh
        env:
          PKG_REPO: target/release/pkg-repo
      - name: The dispatcher on a real engine — a task container born with nothing on its own internal network with its egress sidecar, staged in and out, completed with the memory peak it measured; a failure, the memory limit's kill and an output outside its list; restarts that re-adopt and sweep orphans; a lease the pool stops hearing; a stop; the disk watcher; pool jobs — a health check's helper through omarchy-task-run on its own network under the job's 2 GB limit, the pool's keyrings fetched before it and no check without them, other engine calls refused, a hung job killed at its timeout while a build beats on; the task caches — two builds at once in their own package caches, a recipe's writes past its own cache reaching nothing, the shared pacman cache read-only and only the signed bytes merged back
        run: bash tests/dispatch-engine.sh
        env:
          PKG_REPO: target/release/pkg-repo
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            target/release/pkg-extract
            target/release/pkg-repo
            target/release/omarchy-cli

  agent:
    name: Host agent (${{ matrix.target }})
    # The omarchy-agent's trust core (#309), on each platform release.yml will
    # ship it for (#311): two builds of this commit give one binary, and its
    # Sigstore check holds against the conformance suite at a pinned commit (not
    # copied here: that repository carries no license file). Its unit tests run
    # in the rust job on Linux, and here on macOS (#320): a Mac runs the same
    # agent, so its tests — the LaunchAgent's plist through plutil among them,
    # and the real caffeinate and osascript a Mac's sleep runs (#329) — run on
    # the platform it ships for.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - name: musl's C compiler, for aws-lc
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Two builds of this commit, in two directories, give one binary
        run: bash tests/agent-reproducible.sh ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
      - uses: actions/checkout@v4
        with:
          repository: sigstore/sigstore-conformance
          ref: 1bdbfd9a2837434268553d3fe22aea93fec4ba2d
          path: sigstore-conformance
          persist-credentials: false
      - name: The Sigstore check against every message-signature vector of sigstore-conformance
        run: cargo test --locked -p omarchy-agent --lib -- --ignored conformance
        env:
          OMARCHY_SIGSTORE_CONFORMANCE: ${{ github.workspace }}/sigstore-conformance
      - name: The agent's tests on macOS — the plist plutil reads, the omarchy VM's size, mounts, clock and rate limit, install and uninstall on a played Mac, caffeinate's PreventUserIdleSystemSleep as pmset lists it and the sleep watcher's start (#329), the seal key in a keychain of its own (#328)
        if: runner.os == 'macOS'
        run: cargo test --locked -p omarchy-agent

  agent-run-loop:
    name: Host agent run loop on a real engine (${{ matrix.engine }})
    # #315: the pinned docker CLI and compose plugin roll a stand-in dispatcher
    # out — two releases, ordered restarts (exit 75) during a guard, broken
    # releases reverted and quarantined, a rollback statement preempting a
    # round — while a task container keeps running throughout; on rootful
    # docker and on rootless podman's API socket. #327: the host worker token
    # moves from etc/dispatcher.env to its read-only file, `docker inspect`
    # shows it in neither the dispatcher's nor the task's environment, and a
    # rotation recreates the dispatcher alone.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: The run loop on ${{ matrix.engine }}, with only the pinned tools and a task that survives every rollout and a token rotation, the token in no container's environment
        run: bash tests/agent-run-loop.sh ${{ matrix.engine }}

  agent-host-orders:
    name: Host agent host orders on a real engine (${{ matrix.engine }})
    # #344: reconcile-now starts a round; retire-legacy writes the marker into a
    # stand-in legacy compose project's directory, then stops and removes that
    # project — and nothing else: a project nobody recorded, the task container
    # and the dispatcher run on — on rootful docker and rootless podman's API
    # socket, with the pinned docker CLI and compose plugin. #325: set-units and
    # set-emulate narrow the run/capacity.json the recreated dispatcher mounts
    # while the task runs on, a value above the envelope is refused, and
    # diagnostics read the stand-in's own log with its token scrubbed. #328: a
    # widening the owner's passkey (pinned at the host) signed raises the units
    # the recreated dispatcher mounts, its replay is refused, and an agent key
    # sealed to the host lands in agent.env, never in the dispatcher's env or
    # mounts.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: The host orders on ${{ matrix.engine }}, beside a stand-in legacy compose project, a narrowing of units and an owner's signed widening end to end
        run: bash tests/agent-host-orders.sh ${{ matrix.engine }}

  agent-runtime-switch:
    name: Host agent runtime switch between two real engines
    # #325: the owner's `omarchy-agent runtime switch` at the host — refused while
    # a task container of the host runs on the engine it is on; drained, the
    # stand-in dispatcher stopped on rootful docker and brought up on rootless
    # podman's API socket through a whole round (pull, replace, guard), and
    # agent.toml naming podman at its end; with the pinned docker CLI and
    # compose plugin.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: The runtime switch from docker to rootless podman
        run: |
          command -v podman >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q podman; }
          bash tests/agent-runtime-switch.sh

  agent-install:
    name: Host agent install on a real engine (${{ matrix.engine }})
    # #317: preflight's egress probe — a task that reaches a stand-in LAN
    # address fails it, one that reaches only the public stand-in passes —
    # and a stand-in legacy compose project left running with the same
    # container ids while uninstall removes the new host's task container;
    # #367: a task network's gateway (the host itself on rootful docker, out
    # of reach behind an INPUT drop for a test /28, as prep-root.sh's
    # OMARCHY-TASKS-HOST holds one, which the script adds with sudo) and
    # rootless podman's network stack, read in /proc as preflight reads it;
    # #372: a task's own network made as the dispatcher makes it — on podman
    # through libpod's API, internal with DNS off — has no gateway a task
    # reaches, the dispatcher's own (pkg-repo, the pinned docker CLI) the
    # same; with the pinned docker CLI, on rootful docker and rootless podman's
    # API socket. pasta's guest-mapped address is tried only where rootless
    # podman runs pasta with it (5.3 on): the runner's podman 4.9 does not, so
    # that part is skipped here with a note and runs by hand on such a host.
    # #373: the probe runs the way a task runs — a network made like a task's,
    # behind an egress sidecar with the dispatcher's deny list (here a stand-in
    # the script builds from this commit's pkg-repo egress on the pinned Arch
    # base; the worker-image job runs it again with the worker image) — and
    # passes on both engines, while a network made without --internal, or a
    # sidecar not given a public address of the host's, fails it.
    # #399: the probe's own argv reads a 0600 keys file of the runner's as its
    # owner as the engine shows it (--user 0:0 on rootless podman, the runner's
    # uid:gid on rootful docker, where the image's root with no capability
    # cannot).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: The egress probe the way a task runs, behind its egress sidecar (a task network's gateway, made as the dispatcher makes it, and the host's loopback too), the probe reading owner-only keys as their owner (#399), and a legacy project on ${{ matrix.engine }}
        run: bash tests/agent-install.sh ${{ matrix.engine }}

  emulated-lane:
    name: Emulated lane on a real engine (${{ matrix.os }})
    # #338 (design v2 §7.5; D33): each runner emulates the other architecture
    # through qemu-user-static's binfmt handler (the F flag), as
    # factory/host/prep-root.sh installs it on a host — the agent's smoke run
    # turns the lane on, the envelope's `emulate = []` and a disabled handler
    # hold it off with the native lane kept, and one build of the other
    # architecture runs emulated through the dispatcher, built, uploaded and
    # completed.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: qemu-user-static's binfmt handlers, with the F flag containers need
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-user-static
          head -n 3 /proc/sys/fs/binfmt_misc/qemu-x86_64 /proc/sys/fs/binfmt_misc/qemu-aarch64 2>/dev/null || true
      - name: The other architecture's lane — the agent's smoke run, the envelope, a disabled handler — and one emulated build through the dispatcher
        run: bash tests/emulated-lane.sh

  sandboxed-runtime:
    name: Sandboxed runtime on a real engine (gVisor)
    # #330 (design v2 §10.4; D43): gVisor's runsc, from a pinned release checked against its
    # SHA-512, registered with the runner's docker (`runsc install`) — the agent's detection
    # finds it after its smoke run on a kernel that is not the engine's (the envelope's
    # `sandbox = "off"`, and a runtime the engine does not list, keep it off); a community
    # build through the dispatcher runs in it, reaching its egress sidecar, while the project's
    # build beside it and every sidecar run on runc; a runtime the engine does not have fails
    # the community task lost before it runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: gVisor's runsc, release 20260928 checked against its SHA-512, registered with docker
        run: |
          set -euo pipefail
          release=20260928
          sha512=4ce35ca83aef7f96b06cde668e0b23aa98b05aa1829508e974196c2a1e02786c95f5bf79315fd7ddcfd88fe7a00f083ed8053e25eff7673d28d5256440caae8b
          curl -fsSLo "$RUNNER_TEMP/gvisor.tar.zstd" "https://storage.googleapis.com/gvisor/releases/release/$release/x86_64/gvisor.tar.zstd"
          echo "$sha512  $RUNNER_TEMP/gvisor.tar.zstd" | sha512sum -c -
          # runsc finds its helpers in gvisor-bin/ beside it.
          sudo mkdir -p /opt/gvisor
          sudo tar --zstd -xf "$RUNNER_TEMP/gvisor.tar.zstd" -C /opt/gvisor
          sudo /opt/gvisor/runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | jq -c 'with_entries(.value |= {path, runtimeType})'
      - name: The sandboxed runtime — the agent finds runsc after its smoke run, a community build runs in it, the project's build and every sidecar on runc, a runtime the engine lacks never falls back
        run: bash tests/sandboxed-runtime.sh

  userns-remap:
    name: Remapped daemon on a real engine (userns-remap)
    # #405 (design v2 §19.1), before the agent keys' ACL: the runner's docker with
    # "userns-remap": "default" merged into its daemon.json (docker makes dockremap and its
    # subordinate range itself), then a plain community build through the real dispatcher —
    # root with docker's default capabilities, as the host set runs it there with
    # userns_mode: host — while its task container and egress sidecar stay remapped: built as
    # the builder, uploaded and completed; the agent holds the model kinds
    # (OMARCHY_AGENT_HELD=userns-remap, #406), so a draft is handed back lost and no probe or
    # agent sidecar is ever made; and the dispatcher's real-engine tests on that engine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: userns-remap on the runner's docker — daemon.json's userns-remap set to default, its other keys kept — restarted
        run: |
          set -euo pipefail
          # The runner's daemon.json has keys of its own (cgroup-parent): merged, not replaced.
          cur="$(sudo cat /etc/docker/daemon.json 2>/dev/null || true)"; [[ -n "$cur" ]] || cur='{}'
          jq -S '. + {"userns-remap": "default"}' <<<"$cur" | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
          for _ in $(seq 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
          docker info --format '{{json .SecurityOptions}}' | grep -q name=userns || { sudo journalctl -u docker --no-pager -n 60; exit 1; }
          docker info --format 'docker {{.ServerVersion}}, {{.Driver}}, {{.DockerRootDir}}'
          grep -H '^dockremap:' /etc/subuid /etc/subgid
      - name: A plain build on the remapped daemon through the dispatcher — the task's writable directories its remapped root's, built as the builder, uploaded and completed — the model kinds held, no probe or agent sidecar made
        run: bash tests/userns-remap.sh

  host-key-tpm:
    name: Host key in a TPM (swtpm behind tpm2-abrmd, against a local pool)
    # #330, the Linux half of hardware-bound host keys (design v2 §14): the real agent makes
    # its key in a TPM 2.0 (swtpm, reached through tpm2-abrmd as /dev/tpmrm0 would be, with the
    # distribution's tpm2-tools) — ECDSA P-256, fixedtpm and fixedparent, no host.ed25519 —
    # and enrolls with the TPM's signature against a local pool (wrangler dev), whose page
    # shows the key in the TPM; the token comes with TPM-signed requests and rotates with
    # the TPM its file names; the key's files load in no other TPM, and a cleared TPM signs
    # nothing more; with no TPM in reach the key is a file and the page says why, and
    # OMARCHY_HOST_KEY=tpm with none enrolls nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - name: swtpm, tpm2-tools, and tpm2-abrmd with its TCTI and a D-Bus to run it on
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends swtpm swtpm-tools tpm2-tools tpm2-abrmd libtss2-tcti-tabrmd0 dbus
      - name: The host key made in a TPM, used there and never out of it; a file key, and why, where there is none
        run: bash tests/host-key-tpm.sh

  agent-self-update:
    name: Host agent self-update under systemd --user
    # #316: deliberately broken builds of a higher agent — a panic while it
    # loads its configuration, a hang before READY=1, a hang after it — are
    # started by the agent's own unit after a swap and rolled back to the
    # running agent, which skips them; a good one passes its health gate; a
    # container runs untouched throughout. The runner's user manager is
    # started by lingering, as the installer does on a host.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Start the runner user's systemd manager
        run: |
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - name: A good build passes its health gate, broken ones are rolled back after three starts
        run: bash tests/agent-self-update.sh

  agent-quadlet:
    name: Host agent on the Quadlet driver (rootless podman, systemd --user)
    # #330: the set as a unit of the user's own systemd on rootless podman,
    # with no compose. podman's own generator reads what the agent renders
    # from the same bundle every other host runs and writes the argv compose
    # would; then the run loop rolls a stand-in dispatcher out as that unit —
    # releases, ordered restarts (exit 75) during a guard counted as the
    # service's restarts, broken releases reverted and quarantined, a
    # rollback statement, the host worker token in its read-only file (#327)
    # and a rotation restarting the unit alone — while a task container keeps
    # running. The
    # runner's user manager is started by lingering, as the installer does
    # on a host.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Start the runner user's systemd manager
        run: |
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - name: The generator reads the rendered set, and the run loop rolls it out as a Quadlet unit with a task that survives every rollout
        run: |
          command -v podman >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q podman; }
          bash tests/agent-quadlet.sh

  agent-version:
    name: Host agent version (raised with every change to the agent)
    # Design v2 D17 (#311): the agent's own semver moves with what goes into
    # its binary, compared with the previous release (its tags, hence the
    # full history), so an unchanged agent keeps its hash and a changed one
    # says so.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: factory/bin/agent-version-check

  agent-fuzz:
    name: Host agent fuzzing (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with tests/agent-fuzz.sh.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-25
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      - name: The manifest, statement, bundle, set, state and co-signature parsers, 60 seconds each
        run: bash tests/agent-fuzz.sh 60

  supply-chain:
    name: Supply chain (cargo deny, cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: cargo deny (advisories, licenses, bans, sources; sigstore-verify's tree included)
        run: cargo deny --locked check
      - name: cargo audit
        run: cargo audit
      - name: The agent carries no async runtime, HTTP stack but ureq, Docker client or OpenSSL
        run: bash tests/agent-deps.sh

  worker:
    name: Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Governance file and CODEOWNERS agree
        working-directory: .
        run: factory/bin/check-governance
      - name: The solo-maintainer exception's switch — check-governance takes a [solo] table that is exactly it and refuses any other
        working-directory: .
        run: bash tests/governance-solo.sh
      - name: The tree carries no ignored, one-machine or secret file
        working-directory: .
        run: bash tests/tracked-tree.sh
      - name: The agent's claude-code provider, against a fake claude
        working-directory: .
        run: python3 tests/agent-claude-code.py
      - name: The broker, against a fake agent and a fake pool
        working-directory: .
        run: python3 tests/broker.py
      - name: The setup script, against an Asahi-like pacman.conf
        working-directory: .
        run: bash tests/setup-script.sh
      - name: The worker's edge repos, against the pool's source directories
        working-directory: .
        run: bash tests/worker-pool-repos.sh
      - name: The worker's own package and its last words
        working-directory: .
        run: bash tests/worker-main-package.sh
      - name: The gate's reading of namcap, and namcap's library map on aarch64
        working-directory: .
        run: bash tests/worker-gate-namcap.sh
      - name: A build container runs make, ninja and cargo with the job count the dispatcher set for its share
        working-directory: .
        run: bash tests/worker-build-jobs.sh
      - name: A build's resources.json says what it held that reclaim cannot free, not the page cache its files filled, in a container at its memory limit
        working-directory: .
        run: bash tests/worker-resources.sh
      - name: The build script's task mode — no pool call, the log cut at its cap, verdict.json always JSON — in a container with the task's mounts
        working-directory: .
        run: bash tests/worker-task-mode.sh
      - name: The build user keeps the egress proxy's variables and nothing else of root's, so makepkg reaches a source from a host's internal task network
        working-directory: .
        run: bash tests/builder-env.sh
      - name: A task's two pacman caches with a real pacman — the host's read-only first, its own writable second; two tasks at once download into their own; what the shared cache holds with each package's .sig is used, and a package without its .sig, beside a wrong one or with bytes it should not hold fails the task
        working-directory: .
        run: bash tests/task-caches.sh
      - name: The worker checks its agent again until it answers, against a stub agent that comes up late
        working-directory: .
        run: bash tests/worker-agent-recheck.sh
      - name: The community builder takes the pool's orders — re-check, restart, a notice, a stop of its task — and nothing the pool answers ends it
        working-directory: .
        run: bash tests/worker-orders.sh
      - name: Every container a task starts or creates carries the task's label, so a stop removes it
        working-directory: .
        run: bash tests/task-containers.sh
      - name: The image reinstalls a Claude Code that does not answer, so a restart of the agent service fixes a broken install
        working-directory: .
        run: bash tests/entrypoint-agent.sh
      - name: The image takes the worker token from a read-only file over the plain variable, which still starts an older release's dispatcher
        working-directory: .
        run: bash tests/entrypoint-token-file.sh
      - name: The restart policy a worker counts on, on a real engine (on-failure:N runs out)
        working-directory: .
        run: bash tests/restart-policy.sh
      - name: The updater follows the pool — brokers first, its lock and its guard — against a stubbed docker and pool
        working-directory: .
        # A loop that stopped honouring its TERM fails within the test's own bounds; this caps anything they miss.
        timeout-minutes: 10
        run: bash tests/omarchy-rollout.sh
      - name: The Studio's host files — the updater in, the timer out, rollout.sh a wake-up — against stubs
        working-directory: .
        run: bash tests/host-setup.sh
      - name: A new host's root-only steps — prep-root.sh does each, twice with no change, and nothing else — against stubs
        working-directory: .
        run: bash tests/prep-root.sh
      - name: shellcheck of prep-root.sh
        working-directory: .
        run: shellcheck factory/host/prep-root.sh
      - name: A Mac's one-time steps — prep-mac.sh installs Colima and Lima only and makes the omarchy VM's three directories outside the home directory, no sudo — against stubs, under dash
        working-directory: .
        run: bash tests/prep-mac.sh
      - name: shellcheck of prep-mac.sh
        working-directory: .
        run: shellcheck factory/host/prep-mac.sh
      - name: The Studio's dress rehearsal tool on a real engine — a stand-in of its legacy set from its compose file, sleepers and placeholders only; its ids the same after a restart and not after a recreation; the visit's checks, a work root under the directory the legacy set mounts refused, a GITHUB_TOKEN as install takes it (#319, #345)
        working-directory: .
        run: bash tests/studio-rehearsal.sh
      - name: shellcheck of studio-rehearsal.sh
        working-directory: .
        run: shellcheck factory/host/studio-rehearsal.sh tests/studio-rehearsal.sh
      - name: The rollback — images and Worker back to a tag — against stubbed buildx and wrangler
        working-directory: .
        run: bash tests/rollback-workflow.sh
      - name: The release — no tag a host follows moves before both architectures started every role
        working-directory: .
        run: bash tests/release-workflow.sh
      - name: What the hosts' trust relies on — one exact cosign, signing only in reviewed environments, the exact identity, pinned images
        working-directory: .
        run: bash tests/trust-pins.sh
      - name: The maintainers' co-signature — ssh-keygen and the agent read one format, governance pins it, and a release stays a draft without it
        working-directory: .
        run: bash tests/cosignature.sh
      - name: busybox, for install.sh's run under busybox sh
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y busybox
      - name: install.sh refuses root and a binary whose SHA-256 differs, downloads under its own mktemp -d, keeps the token out of argv — under sh, dash, bash --posix and busybox sh, and shellcheck
        working-directory: .
        run: bash tests/install-sh.sh
      - name: The agent's version check fails a change to the agent without a version raise
        working-directory: .
        run: bash tests/agent-version.sh
      - name: A maintainer's legacy set's command (factory/host/omarchy-worker, until P3), against a stubbed docker and pool — no new set, no mode, the switch guard
        working-directory: .
        run: bash tests/omarchy-worker-cli.sh
      - name: The contributor worker path and the community-worker claim code are gone — none of their identifiers in worker/src (#343)
        working-directory: .
        run: bash tests/contributor-path-gone.sh

  worker-image:
    name: Worker image (a local build — every role starts)
    # What the release does before any tag moves (#277), on this commit's own
    # binaries: packaged as the release packages them and served to the build
    # from this runner (TOOLS_URL), then tests/image-smoke.sh starts every role.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p pkg-extract -p pkg-repo -p omarchy-cli
      - name: Build the image from them, and start every role
        run: |
          set -euo pipefail
          release=v0.0.0-ci; name="omarchy-pool-$release-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/pkg-extract target/release/pkg-repo target/release/omarchy-cli "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          (cd dist && exec python3 -m http.server 8765 --bind 127.0.0.1) >/dev/null 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          docker build --network host -f factory/image/Containerfile --build-arg ARCH=x86_64 --build-arg POOL_RELEASE="$release" \
            --build-arg TOOLS_URL=http://127.0.0.1:8765 -t omarchy-worker:ci .
          bash tests/image-smoke.sh omarchy-worker:ci
      # The agent renders the dispatcher's etc/dispatcher.env there (#371); built on its own, so the
      # image's binaries above are built with their own features.
      - run: cargo build --release -p omarchy-agent
      # On docker only: the script's podman run (RUNTIME=podman, the dispatcher's docker CLI on
      # podman's socket) is by hand; in CI a task network the dispatcher makes on podman is covered
      # by agent-install's pkg-repo test on rootless podman (#372).
      - name: Task networks on a real engine — the dispatcher started from the agent's etc/dispatcher.env and its read-only token file, no token or key in any container's environment; a public mirror through the egress sidecar only; cloud metadata, a name resolving to loopback, raw sockets, the host (its LAN and public addresses, and its services through a network's gateway) and the other task out of reach; the budget's caps; the agent sidecar and the probe reading the 0600 keys of a non-root user as their owner, every capability dropped (#399); the probe sidecar; a signed exception's bridge, its gateway closed behind an INPUT drop for its subnet; a stop removes only its own
        run: bash tests/task-networks.sh
        env:
          WORKER_IMAGE: omarchy-worker:ci
          PKG_REPO: target/release/pkg-repo
          OMARCHY_AGENT: target/release/omarchy-agent
      # #373: the install's egress probe behind the egress sidecar this image runs, as every
      # task's (agent-install's own jobs use a stand-in built from the same pkg-repo).
      - name: The install's egress probe the way a task runs, behind the worker image's own egress sidecar, on docker
        run: bash tests/agent-install.sh docker
        env:
          WORKER_IMAGE: omarchy-worker:ci
